name: Shinobi Live Synchronization Engine

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    name: Sync Live Shinobi Telemetry & 3D City
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Live Shinobi Telemetry SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/update-shinobi-live.js

      - name: Generate 3D Contribution City
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push synchronized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/id-dashboard.svg profile-3d-contrib/
          if git commit -m "chore: synchronize live shinobi telemetry and contribution city [skip ci]"; then
            git push
          fi
