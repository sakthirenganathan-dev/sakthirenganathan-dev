<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="hTitle hDesc">
  <title id="hTitle">SHINOBI: The Six Paths — Cinematic Opening</title>
  <desc id="hDesc">Seamless cinematic anime developer opening featuring a massive animated Rinnegan vortex, rotating chakra rings, glowing lightning, and fluid typography.</desc>
  <defs>
    <!-- Seamless Atmospheric Background -->
    <radialGradient id="nebulaCore" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#240c4a" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#14062b" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#080214" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030008" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="eyeAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="15%" stop-color="#e9d5ff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#6b21a8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e0538" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#083344" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Flow Gradients -->
    <linearGradient id="violetBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030008" stop-opacity="0"/>
      <stop offset="15%" stop-color="#030008" stop-opacity="1"/>
      <stop offset="85%" stop-color="#030008" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030008" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow & Atmosphere Filters -->
    <filter id="highGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b1"/>
      <feGaussianBlur stdDeviation="3" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tomoe Glyph -->
    <g id="tomoeMark">
      <path d="M 0 -11 C 7 -11 11 -7 11 0 C 11 8 4 13 -3 13 C -10 13 -14 7 -14 0 C -14 -7 -8 -9 -4 -9 C -3 -9 -1 -7 -1 -5 C -1 -3 -3 0 -5 1 C -3 0 -1 -2 -1 -5 C -1 -9 -6 -12 -10 -12 C -1 -13 0 -11 0 -11 Z" fill="#ffffff" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="3.5" fill="#f5f3ff"/>
    </g>

    <style>
      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes rinneganPulse {
        0%, 100% { transform: scale(1); opacity: 0.88; }
        50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 45px #9333ea); }
      }
      @keyframes beamSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes emberFloat1 {
        0% { transform: translateY(0) translateX(0); opacity: 0; }
        25% { opacity: 0.9; }
        85% { opacity: 0.7; }
        100% { transform: translateY(-110px) translateX(40px); opacity: 0; }
      }
      @keyframes emberFloat2 {
        0% { transform: translateY(0) translateX(0); opacity: 0; }
        35% { opacity: 0.85; }
        80% { opacity: 0.5; }
        100% { transform: translateY(-130px) translateX(-45px); opacity: 0; }
      }
      @keyframes chidoriFlash {
        0%, 91%, 95%, 100% { opacity: 0; }
        92%, 94% { opacity: 0.9; }
        93% { opacity: 1; }
      }
      @keyframes textShimmer {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5)); }
        50% { filter: drop-shadow(0 0 28px rgba(103, 232, 249, 0.85)); }
      }
      .spin-slow {
        animation: spinCW 50s linear infinite;
        transform-origin: 600px 240px;
      }
      .spin-reverse {
        animation: spinCCW 36s linear infinite;
        transform-origin: 600px 240px;
      }
      .eye-pulse {
        animation: rinneganPulse 4.5s ease-in-out infinite;
        transform-origin: 600px 240px;
      }
      .lightning-fx {
        animation: chidoriFlash 5s infinite;
      }
      .e1 { animation: emberFloat1 5s ease-out infinite; }
      .e2 { animation: emberFloat2 6s ease-out infinite 1.5s; }
      .e3 { animation: emberFloat1 5.5s ease-out infinite 2.8s; }
      .e4 { animation: emberFloat2 6.5s ease-out infinite 0.8s; }
      .title-shimmer {
        animation: textShimmer 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Seamless Canvas (No boxy border, naturally blending edges) -->
  <rect width="1200" height="520" fill="url(#nebulaCore)"/>

  <!-- Fluid Horizontal Light Energy Stream -->
  <g opacity="0.35">
    <path d="M 0 240 Q 300 180 600 240 T 1200 240" fill="none" stroke="url(#violetBeam)" stroke-width="3" filter="url(#highGlow)"/>
    <path d="M 0 260 Q 350 320 600 260 T 1200 260" fill="none" stroke="#67e8f9" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Giant Background Kanji Atmosphere (Watermark) -->
  <text x="600" y="320" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="280" fill="#a855f7" opacity="0.04" text-anchor="middle">六道</text>
  <text x="180" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="240" fill="#06b6d4" opacity="0.03" text-anchor="middle">忍</text>
  <text x="1020" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="240" fill="#ec4899" opacity="0.03" text-anchor="middle">影</text>

  <!-- ==================== CENTRAL GIANT RINNEGAN VORTEX ==================== -->
  <g class="eye-pulse">
    <!-- Massive Outer Aura -->
    <circle cx="600" cy="240" r="230" fill="url(#eyeAura)" opacity="0.6"/>
    <circle cx="600" cy="240" r="160" fill="url(#cyanAura)" opacity="0.5"/>

    <!-- Concentric Rinnegan Ripple Rings -->
    <g fill="none" stroke="#c084fc" stroke-linecap="round" filter="url(#softGlow)">
      <circle cx="600" cy="240" r="215" stroke-width="2" opacity="0.35" stroke-dasharray="16 12"/>
      <circle cx="600" cy="240" r="175" stroke-width="2.5" opacity="0.65"/>
      <circle cx="600" cy="240" r="135" stroke-width="3" opacity="0.8"/>
      <circle cx="600" cy="240" r="95" stroke-width="3.5" opacity="0.9"/>
      <circle cx="600" cy="240" r="60" stroke-width="4" opacity="1"/>
      <circle cx="600" cy="240" r="30" stroke-width="3.5" stroke="#ffffff" opacity="1"/>
    </g>

    <!-- Pupil Core -->
    <circle cx="600" cy="240" r="16" fill="#04000a" stroke="#ffffff" stroke-width="2.5" filter="url(#highGlow)"/>
    <circle cx="600" cy="240" r="7" fill="#67e8f9"/>
  </g>

  <!-- Outer Rotating Six Paths Tomoe Ring -->
  <g class="spin-slow">
    <g transform="translate(600 105)"><use href="#tomoeMark"/></g>
    <g transform="translate(717 172) rotate(60)"><use href="#tomoeMark"/></g>
    <g transform="translate(717 308) rotate(120)"><use href="#tomoeMark"/></g>
    <g transform="translate(600 375) rotate(180)"><use href="#tomoeMark"/></g>
    <g transform="translate(483 308) rotate(240)"><use href="#tomoeMark"/></g>
    <g transform="translate(483 172) rotate(300)"><use href="#tomoeMark"/></g>
  </g>

  <!-- Inner Counter-Rotating Tomoe Ring -->
  <g class="spin-reverse">
    <g transform="translate(600 145)"><use href="#tomoeMark"/></g>
    <g transform="translate(682 288) rotate(120)"><use href="#tomoeMark"/></g>
    <g transform="translate(518 288) rotate(240)"><use href="#tomoeMark"/></g>
  </g>

  <!-- Chidori Lightning Discharges across the Eye -->
  <g class="lightning-fx" stroke="#67e8f9" stroke-width="2.5" fill="none" filter="url(#highGlow)" opacity="0.95">
    <path d="M 480 180 L 520 200 L 505 225 L 560 235 L 600 240"/>
    <path d="M 720 170 L 680 195 L 705 220 L 650 235 L 600 240"/>
    <path d="M 640 330 L 615 295 L 635 275 L 600 240"/>
  </g>

  <!-- Floating Chakra Embers & Particles -->
  <g filter="url(#softGlow)">
    <circle cx="520" cy="300" r="3.5" fill="#67e8f9" class="e1"/>
    <circle cx="680" cy="320" r="3" fill="#d8b4fe" class="e2"/>
    <circle cx="580" cy="160" r="3.2" fill="#c084fc" class="e3"/>
    <circle cx="730" cy="220" r="2.5" fill="#38bdf8" class="e4"/>
    <circle cx="460" cy="240" r="3" fill="#f472b6" class="e1"/>
    <circle cx="640" cy="380" r="3.8" fill="#a855f7" class="e3"/>
    <circle cx="340" cy="260" r="2.8" fill="#67e8f9" class="e2"/>
    <circle cx="860" cy="240" r="2.8" fill="#c084fc" class="e4"/>
  </g>

  <!-- ==================== FLOWING CINEMATIC TYPOGRAPHY ==================== -->
  
  <!-- Top Category Stream (No box, floating glow) -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <text font-family="'Segoe UI', Roboto, monospace" font-size="14" font-weight="900" letter-spacing="8" fill="#c084fc" opacity="0.9">
      ✦ · 影 · THE SIX PATHS CHRONICLES · 忍 · ✦
    </text>
  </g>

  <!-- Main Hero Title Banner (Floating cinematic title) -->
  <g transform="translate(600, 420)" text-anchor="middle" class="title-shimmer">
    <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="6" fill="#ffffff">
      SAKTHI RENGANATHAN
    </text>
  </g>

  <!-- Subtitle: FULL-STACK DEVELOPER · AI BUILDER · SHINOBI -->
  <g transform="translate(600, 462)" text-anchor="middle">
    <text font-family="'Segoe UI', monospace, sans-serif" font-weight="800" font-size="15" letter-spacing="6" fill="#67e8f9">
      FULL-STACK DEVELOPER · AI BUILDER · SHINOBI
    </text>
  </g>

  <!-- Narrative Stream (Bottom Floating Line) -->
  <g transform="translate(600, 495)" text-anchor="middle">
    <text font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="2">
      CHANNELING CHAKRA INTO INTELLIGENT SYSTEMS, AUTONOMOUS AGENTS &amp; 3D EXPERIENCES
    </text>
  </g>
</svg>
