<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="rivTitle rivDesc">
  <title id="rivTitle">Continuous Naruto Character Universe — Chakra River</title>
  <desc id="rivDesc">Seamless flowing anime character journey without card boundaries, featuring Team 7, Uchiha Clan, Akatsuki, Sannin &amp; Hokage, and Allied Shinobi along a continuous chakra river.</desc>
  <defs>
    <!-- Background Atmosphere -->
    <radialGradient id="spaceAtmosphere" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#16082e" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0a0317" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030008" stop-opacity="1"/>
    </radialGradient>

    <!-- Continuous River Gradients -->
    <linearGradient id="chakraRiver1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="chakraRiver2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="auraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes waveFlow1 {
        0% { transform: translateX(0); }
        50% { transform: translateX(-50px) translateY(8px); }
        100% { transform: translateX(0); }
      }
      @keyframes waveFlow2 {
        0% { transform: translateX(0); }
        50% { transform: translateX(50px) translateY(-8px); }
        100% { transform: translateX(0); }
      }
      @keyframes starPulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 12px #67e8f9); }
      }
      .river-wave-1 {
        animation: waveFlow1 12s ease-in-out infinite;
      }
      .river-wave-2 {
        animation: waveFlow2 14s ease-in-out infinite;
      }
      .pulsing-node {
        animation: starPulse 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas (Seamless, no card container) -->
  <rect width="1200" height="520" fill="url(#spaceAtmosphere)"/>

  <!-- Top Narrative Horizon -->
  <g transform="translate(600, 48)" text-anchor="middle">
    <text font-family="monospace" font-size="12" fill="#c084fc" letter-spacing="4" font-weight="700">
      02 // CONTINUOUS SHINOBI JOURNEY · THE LIVING UNIVERSE
    </text>
    <text y="28" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="2">
      THE CHAKRA CONTINUUM — LEGENDS OF THE FIVE NATIONS
    </text>
  </g>

  <!-- ==================== FLOWING CHAKRA RIVER HIGHWAYS ==================== -->
  <g class="river-wave-1" opacity="0.75" filter="url(#auraGlow)">
    <path d="M -50 250 C 150 180, 350 320, 600 240 C 850 160, 1050 300, 1250 240" fill="none" stroke="url(#chakraRiver1)" stroke-width="4.5"/>
  </g>
  <g class="river-wave-2" opacity="0.5" filter="url(#auraGlow)">
    <path d="M -50 270 C 200 340, 450 190, 600 260 C 750 330, 1000 180, 1250 260" fill="none" stroke="url(#chakraRiver2)" stroke-width="2.5" stroke-dasharray="14 10"/>
  </g>

  <!-- Background Ambient Kanji Emblems along the River -->
  <text x="120" y="270" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="110" fill="#f97316" opacity="0.05" text-anchor="middle">火</text>
  <text x="360" y="270" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="110" fill="#a855f7" opacity="0.05" text-anchor="middle">団</text>
  <text x="600" y="270" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="110" fill="#ef4444" opacity="0.05" text-anchor="middle">暁</text>
  <text x="840" y="270" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="110" fill="#10b981" opacity="0.05" text-anchor="middle">仙</text>
  <text x="1080" y="270" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="110" fill="#06b6d4" opacity="0.05" text-anchor="middle">連</text>

  <!-- ==================== 5 SEAMLESS CHARACTER CONSTELLATIONS ==================== -->

  <!-- CONSTELLATION 1: WILL OF FIRE (Team 7 & Kakashi) -> x: 120 -->
  <g transform="translate(120, 240)">
    <!-- Central Energy Pivot -->
    <circle cx="0" cy="0" r="16" fill="#3b1506" stroke="#f97316" stroke-width="2.5" class="pulsing-node"/>
    <circle cx="0" cy="0" r="6" fill="#fb923c"/>
    <!-- Connecting Filament Lines -->
    <line x1="0" y1="0" x2="-35" y2="-90" stroke="#f97316" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="0" x2="35" y2="-90" stroke="#f97316" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="0" x2="-30" y2="85" stroke="#f97316" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="0" x2="30" y2="85" stroke="#f97316" stroke-width="1.2" opacity="0.5"/>
    <!-- Upper Stream Text -->
    <g transform="translate(0, -105)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
      <text font-size="15" font-weight="900" fill="#fb923c" letter-spacing="1">TEAM 7 · WILL OF FIRE</text>
      <text y="20" font-size="12" font-weight="700" fill="#ffffff">Naruto Uzumaki</text>
      <text y="36" font-size="11" fill="#94a3b8">Nine-Tails Jinchuriki</text>
    </g>
    <!-- Lower Stream Text -->
    <g transform="translate(0, 85)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
      <text y="18" font-size="12" font-weight="700" fill="#38bdf8">Sasuke Uchiha</text>
      <text y="34" font-size="11" fill="#94a3b8">Rinnegan &amp; Chidori</text>
      <text y="52" font-size="11" fill="#f472b6">Sakura Haruno · Kakashi</text>
    </g>
  </g>

  <!-- CONSTELLATION 2: UCHIHA BLOODLINE (Madara, Itachi, Obito, Shisui) -> x: 360 -->
  <g transform="translate(360, 240)">
    <circle cx="0" cy="0" r="16" fill="#240a45" stroke="#c084fc" stroke-width="2.5" class="pulsing-node"/>
    <circle cx="0" cy="0" r="6" fill="#e9d5ff"/>
    <line x1="0" y1="0" x2="0" y2="-85" stroke="#a855f7" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="85" stroke="#a855f7" stroke-width="1.2" opacity="0.5"/>
    <!-- Upper Stream Text -->
    <g transform="translate(0, -105)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
      <text font-size="15" font-weight="900" fill="#c084fc" letter-spacing="1">UCHIHA · DOUJUTSU</text>
      <text y="20" font-size="12" font-weight="700" fill="#ffffff">Madara Uchiha</text>
      <text y="36" font-size="11" fill="#94a3b8">Perfect Susanoo &amp; Rebirth</text>
    </g>
    <!-- Lower Stream Text -->
    <g transform="translate(0, 85)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
      <text y="18" font-size="12" font-weight="700" fill="#f87171">Itachi Uchiha</text>
      <text y="34" font-size="11" fill="#94a3b8">Tsukuyomi &amp; Totsuka</text>
      <text y="52" font-size="11" fill="#d8b4fe">Obito (Kamui) · Shisui</text>
    </g>
  </g>

  <!-- CONSTELLATION 3: AKATSUKI ORDER (Pain, Konan, Kisame, Deidara) -> x: 600 -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="16" fill="#3b0606" stroke="#ef4444" stroke-width="2.5" class="pulsing-node"/>
    <circle cx="0" cy="0" r="6" fill="#fca5a5"/>
    <line x1="0" y1="0" x2="0" y2="-85" stroke="#ef4444" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="85" stroke="#ef4444" stroke-width="1.2" opacity="0.5"/>
    <!-- Upper Stream Text -->
    <g transform="translate(0, -105)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
      <text font-size="15" font-weight="900" fill="#f87171" letter-spacing="1">AKATSUKI ORDER</text>
      <text y="20" font-size="12" font-weight="700" fill="#ffffff">Pain / Nagato</text>
      <text y="36" font-size="11" fill="#94a3b8">Six Paths of Pain &amp; Shinra</text>
    </g>
    <!-- Lower Stream Text -->
    <g transform="translate(0, 85)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
      <text y="18" font-size="12" font-weight="700" fill="#c084fc">Konan (Paper Deity)</text>
      <text y="34" font-size="11" fill="#94a3b8">Kisame (Samehada)</text>
      <text y="52" font-size="11" fill="#facc15">Deidara · Sasori · Itachi</text>
    </g>
  </g>

  <!-- CONSTELLATION 4: HOKAGE & SANNIN (Hashirama, Minato, Tsunade, Jiraiya) -> x: 840 -->
  <g transform="translate(840, 240)">
    <circle cx="0" cy="0" r="16" fill="#043324" stroke="#10b981" stroke-width="2.5" class="pulsing-node"/>
    <circle cx="0" cy="0" r="6" fill="#86efac"/>
    <line x1="0" y1="0" x2="0" y2="-85" stroke="#10b981" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="85" stroke="#10b981" stroke-width="1.2" opacity="0.5"/>
    <!-- Upper Stream Text -->
    <g transform="translate(0, -105)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
      <text font-size="15" font-weight="900" fill="#6ee7b7" letter-spacing="1">HOKAGE &amp; SANNIN</text>
      <text y="20" font-size="12" font-weight="700" fill="#ffffff">Hashirama Senju</text>
      <text y="36" font-size="11" fill="#94a3b8">God of Shinobi · Wood Style</text>
    </g>
    <!-- Lower Stream Text -->
    <g transform="translate(0, 85)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
      <text y="18" font-size="12" font-weight="700" fill="#fde047">Minato Namikaze (4th)</text>
      <text y="34" font-size="11" fill="#94a3b8">Jiraiya &amp; Tsunade</text>
      <text y="52" font-size="11" fill="#a78bfa">Orochimaru (Ryuchi Sage)</text>
    </g>
  </g>

  <!-- CONSTELLATION 5: ALLIED SHINOBI (Gaara, Killer B, Guy, Lee) -> x: 1080 -->
  <g transform="translate(1080, 240)">
    <circle cx="0" cy="0" r="16" fill="#063245" stroke="#06b6d4" stroke-width="2.5" class="pulsing-node"/>
    <circle cx="0" cy="0" r="6" fill="#67e8f9"/>
    <line x1="0" y1="0" x2="0" y2="-85" stroke="#06b6d4" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="85" stroke="#06b6d4" stroke-width="1.2" opacity="0.5"/>
    <!-- Upper Stream Text -->
    <g transform="translate(0, -105)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
      <text font-size="15" font-weight="900" fill="#67e8f9" letter-spacing="1">ALLIED FORCES</text>
      <text y="20" font-size="12" font-weight="700" fill="#ffffff">Gaara (Kazekage)</text>
      <text y="36" font-size="11" fill="#94a3b8">Supreme Commander</text>
    </g>
    <!-- Lower Stream Text -->
    <g transform="translate(0, 85)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
      <text y="18" font-size="12" font-weight="700" fill="#facc15">Killer B (Eight-Tails)</text>
      <text y="34" font-size="11" fill="#94a3b8">Might Guy (Eight Gates)</text>
      <text y="52" font-size="11" fill="#86efac">Rock Lee · Shikamaru · Neji</text>
    </g>
  </g>

  <!-- Bottom Continuity Streamline -->
  <g transform="translate(600, 490)" text-anchor="middle">
    <text font-family="'Segoe UI', sans-serif" font-size="13" fill="#64748b" letter-spacing="2">
      FIVE GREAT NATIONS · 80,000 SHINOBI UNITED UNDER ONE NATIVE WILL
    </text>
  </g>
</svg>
