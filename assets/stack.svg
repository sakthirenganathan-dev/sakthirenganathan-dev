<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">Chakra Tech Orbit — Six Paths Development Toolkit</title>
  <desc id="stackDesc">Interactive animated SVG technology orbit showcasing React, JavaScript, Three.js, GSAP, Java, Flutter, AI, Git, and Web technologies within rotating chakra rings.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="stackBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1b0a38" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#0e0520" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#04010a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="70%" stop-color="#170638"/>
      <stop offset="100%" stop-color="#090217"/>
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16082b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d041a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes orbitClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes counterRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes counterRotateCounter {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes corePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px #9333ea); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 35px #06b6d4); }
      }
      @keyframes rayPulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.6; stroke: #67e8f9; }
      }
      .ring-1 {
        animation: orbitClockwise 38s linear infinite;
        transform-origin: 600px 230px;
      }
      .ring-2 {
        animation: orbitCounter 52s linear infinite;
        transform-origin: 600px 230px;
      }
      /* Keep icons upright as their parent group rotates */
      .keep-upright-1 {
        animation: counterRotate 38s linear infinite;
      }
      .keep-upright-2 {
        animation: counterRotateCounter 52s linear infinite;
      }
      .chakra-core {
        animation: corePulse 4s ease-in-out infinite;
        transform-origin: 600px 230px;
      }
      .ray-anim {
        animation: rayPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" rx="24" fill="url(#stackBg)"/>
  <rect width="1196" height="556" x="2" y="2" rx="23" fill="none" stroke="#6b21a8" stroke-width="1.5" opacity="0.6"/>

  <!-- Watermark Kanji: 術 (Jutsu / Technique) -->
  <text x="600" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="280" fill="#a855f7" opacity="0.04" text-anchor="middle">術</text>

  <!-- Top Title Strip -->
  <g transform="translate(50, 48)">
    <text font-family="monospace" font-size="13" fill="#a78bfa" letter-spacing="3" font-weight="700">02 / CHAKRA TECH ORBIT</text>
    <text y="28" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="1">
      SIX PATHS DEVELOPER ARSENAL
    </text>
  </g>
  <g transform="translate(1000, 48)" text-anchor="end">
    <rect x="-140" y="-14" width="140" height="28" rx="14" fill="#1e0c38" stroke="#06b6d4" stroke-width="1"/>
    <text x="-12" y="5" font-family="monospace" font-size="11" fill="#67e8f9" font-weight="700">ORBIT ACTIVE</text>
    <circle cx="-120" cy="0" r="4" fill="#06b6d4"/>
  </g>

  <!-- Connecting Energy Tendrils from Core to Outer Rings -->
  <g stroke="#7c3aed" stroke-width="1.2" opacity="0.35" class="ray-anim">
    <line x1="600" y1="230" x2="600" y2="80"/>
    <line x1="600" y1="230" x2="600" y2="380"/>
    <line x1="600" y1="230" x2="450" y2="230"/>
    <line x1="600" y1="230" x2="750" y2="230"/>
    <line x1="600" y1="230" x2="350" y2="100"/>
    <line x1="600" y1="230" x2="850" y2="360"/>
    <line x1="600" y1="230" x2="350" y2="360"/>
    <line x1="600" y1="230" x2="850" y2="100"/>
  </g>

  <!-- Static Track Rings -->
  <circle cx="600" cy="230" r="145" fill="none" stroke="#4c1d95" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.7"/>
  <circle cx="600" cy="230" r="235" fill="none" stroke="#2e1065" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.7"/>

  <!-- Center Chakra Core (Six Paths Rinnegan Core) -->
  <g class="chakra-core">
    <circle cx="600" cy="230" r="75" fill="url(#coreGlow)"/>
    <circle cx="600" cy="230" r="52" fill="#130829" stroke="#c084fc" stroke-width="2.5" filter="url(#glowFilter)"/>
    <!-- Rinnegan internal ripple -->
    <circle cx="600" cy="230" r="36" fill="none" stroke="#a855f7" stroke-width="1.8"/>
    <circle cx="600" cy="230" r="22" fill="none" stroke="#e9d5ff" stroke-width="1.8"/>
    <circle cx="600" cy="230" r="9" fill="#ffffff" filter="url(#glowFilter)"/>
    <!-- Core Labels -->
    <text x="600" y="222" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">CHAKRA</text>
    <text x="600" y="240" font-family="monospace" font-weight="700" font-size="10" fill="#67e8f9" text-anchor="middle" letter-spacing="2">CORE</text>
  </g>

  <!-- ==================== ORBIT RING 1 (Inner - radius 145px) ==================== -->
  <g class="ring-1">
    <!-- Orbital Guide Ring with Glowing Dash -->
    <circle cx="600" cy="230" r="145" fill="none" stroke="url(#ringGrad1)" stroke-width="2.5" stroke-dasharray="25 60" opacity="0.85"/>

    <!-- Node 1: REACT (Angle 0 deg -> x: 745, y: 230) -->
    <g transform="translate(745, 230)">
      <g class="keep-upright-1" transform-origin="0 0">
        <circle cx="0" cy="0" r="30" fill="url(#nodeGlow)" stroke="#06b6d4" stroke-width="2" filter="url(#nodeShadow)"/>
        <!-- React Atom Icon -->
        <ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#67e8f9" stroke-width="1.3"/>
        <ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#67e8f9" stroke-width="1.3" transform="rotate(60)"/>
        <ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#67e8f9" stroke-width="1.3" transform="rotate(120)"/>
        <circle cx="0" cy="0" r="2.5" fill="#67e8f9"/>
        <text x="0" y="44" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#67e8f9" text-anchor="middle">React</text>
      </g>
    </g>

    <!-- Node 2: JAVASCRIPT (Angle 90 deg -> x: 600, y: 375) -->
    <g transform="translate(600, 375)">
      <g class="keep-upright-1" transform-origin="0 0">
        <circle cx="0" cy="0" r="30" fill="url(#nodeGlow)" stroke="#facc15" stroke-width="2" filter="url(#nodeShadow)"/>
        <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#facc15"/>
        <text x="3" y="6" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">JS</text>
        <text x="0" y="44" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#facc15" text-anchor="middle">JavaScript</text>
      </g>
    </g>

    <!-- Node 3: JAVA (Angle 180 deg -> x: 455, y: 230) -->
    <g transform="translate(455, 230)">
      <g class="keep-upright-1" transform-origin="0 0">
        <circle cx="0" cy="0" r="30" fill="url(#nodeGlow)" stroke="#f97316" stroke-width="2" filter="url(#nodeShadow)"/>
        <!-- Java Cup Stylized -->
        <path d="M -7 4 C -7 9 7 9 7 4 L 7 -5 L -7 -5 Z" fill="none" stroke="#fb923c" stroke-width="1.5"/>
        <path d="M 7 -2 C 10 -2 10 2 7 2" fill="none" stroke="#fb923c" stroke-width="1.2"/>
        <path d="M -4 -8 C -2 -7 -4 -6 -2 -5" fill="none" stroke="#fdba74" stroke-width="1"/>
        <path d="M 0 -9 C 2 -8 0 -7 2 -6" fill="none" stroke="#fdba74" stroke-width="1"/>
        <text x="0" y="44" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#fb923c" text-anchor="middle">Java</text>
      </g>
    </g>

    <!-- Node 4: FLUTTER (Angle 270 deg -> x: 600, y: 85) -->
    <g transform="translate(600, 85)">
      <g class="keep-upright-1" transform-origin="0 0">
        <circle cx="0" cy="0" r="30" fill="url(#nodeGlow)" stroke="#38bdf8" stroke-width="2" filter="url(#nodeShadow)"/>
        <!-- Flutter Wings -->
        <path d="M -6 -8 L 4 2 L 9 -3 L -1 -13 Z" fill="#38bdf8"/>
        <path d="M -2 4 L 4 10 L 9 5 L 3 -1 Z" fill="#0284c7"/>
        <text x="0" y="44" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">Flutter</text>
      </g>
    </g>
  </g>

  <!-- ==================== ORBIT RING 2 (Outer - radius 235px) ==================== -->
  <g class="ring-2">
    <!-- Orbital Guide Ring -->
    <circle cx="600" cy="230" r="235" fill="none" stroke="url(#ringGrad2)" stroke-width="2" stroke-dasharray="30 70" opacity="0.8"/>

    <!-- Node 1: THREE.JS (0 deg -> x: 835, y: 230) -->
    <g transform="translate(835, 230)">
      <g class="keep-upright-2" transform-origin="0 0">
        <circle cx="0" cy="0" r="27" fill="url(#nodeGlow)" stroke="#a855f7" stroke-width="2" filter="url(#nodeShadow)"/>
        <!-- 3D Triangle / Polyhedron -->
        <polygon points="0,-10 9,7 -9,7" fill="none" stroke="#d8b4fe" stroke-width="1.5"/>
        <line x1="0" y1="-10" x2="0" y2="0" stroke="#c084fc" stroke-width="1.2"/>
        <line x1="9" y1="7" x2="0" y2="0" stroke="#c084fc" stroke-width="1.2"/>
        <line x1="-9" y1="7" x2="0" y2="0" stroke="#c084fc" stroke-width="1.2"/>
        <text x="0" y="40" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#d8b4fe" text-anchor="middle">Three.js</text>
      </g>
    </g>

    <!-- Node 2: GSAP (60 deg -> x: 717, y: 433) -->
    <g transform="translate(717, 433)">
      <g class="keep-upright-2" transform-origin="0 0">
        <circle cx="0" cy="0" r="27" fill="url(#nodeGlow)" stroke="#22c55e" stroke-width="2" filter="url(#nodeShadow)"/>
        <!-- GSAP Neon Lightning G -->
        <circle cx="0" cy="0" r="9" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="40 10"/>
        <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11" fill="#4ade80" text-anchor="middle">G</text>
        <text x="0" y="40" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#4ade80" text-anchor="middle">GSAP</text>
      </g>
    </g>

    <!-- Node 3: AI / ML (120 deg -> x: 482, y: 433) -->
    <g transform="translate(482, 433)">
      <g class="keep-upright-2" transform-origin="0 0">
        <circle cx="0" cy="0" r="27" fill="url(#nodeGlow)" stroke="#ec4899" stroke-width="2" filter="url(#nodeShadow)"/>
        <!-- Neural Node Network -->
        <circle cx="-5" cy="-5" r="3" fill="#f472b6"/>
        <circle cx="6" cy="-4" r="3" fill="#f472b6"/>
        <circle cx="0" cy="5" r="3.5" fill="#f43f5e"/>
        <line x1="-5" y1="-5" x2="6" y2="-4" stroke="#f472b6" stroke-width="1.2"/>
        <line x1="-5" y1="-5" x2="0" y2="5" stroke="#f472b6" stroke-width="1.2"/>
        <line x1="6" y1="-4" x2="0" y2="5" stroke="#f472b6" stroke-width="1.2"/>
        <text x="0" y="40" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#f472b6" text-anchor="middle">AI Dev</text>
      </g>
    </g>

    <!-- Node 4: GIT & GITHUB (180 deg -> x: 365, y: 230) -->
    <g transform="translate(365, 230)">
      <g class="keep-upright-2" transform-origin="0 0">
        <circle cx="0" cy="0" r="27" fill="url(#nodeGlow)" stroke="#f43f5e" stroke-width="2" filter="url(#nodeShadow)"/>
        <!-- Git Branch Icon -->
        <circle cx="-5" cy="-4" r="2.5" fill="#f43f5e"/>
        <circle cx="-5" cy="5" r="2.5" fill="#f43f5e"/>
        <circle cx="5" cy="-2" r="2.5" fill="#f43f5e"/>
        <line x1="-5" y1="-4" x2="-5" y2="5" stroke="#f43f5e" stroke-width="1.5"/>
        <path d="M -5 0 Q 0 0 5 -2" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="0" y="40" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#f87171" text-anchor="middle">Git / GitHub</text>
      </g>
    </g>

    <!-- Node 5: HTML5 (240 deg -> x: 482, y: 27) -->
    <g transform="translate(482, 27)">
      <g class="keep-upright-2" transform-origin="0 0">
        <circle cx="0" cy="0" r="27" fill="url(#nodeGlow)" stroke="#e11d48" stroke-width="2" filter="url(#nodeShadow)"/>
        <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" fill="#fb7185" text-anchor="middle">&lt;5&gt;</text>
        <text x="0" y="40" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#fb7185" text-anchor="middle">HTML5</text>
      </g>
    </g>

    <!-- Node 6: CSS3 (300 deg -> x: 717, y: 27) -->
    <g transform="translate(717, 27)">
      <g class="keep-upright-2" transform-origin="0 0">
        <circle cx="0" cy="0" r="27" fill="url(#nodeGlow)" stroke="#3b82f6" stroke-width="2" filter="url(#nodeShadow)"/>
        <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" fill="#60a5fa" text-anchor="middle">{ 3 }</text>
        <text x="0" y="40" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#60a5fa" text-anchor="middle">CSS3</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM SKILL MATRIX SUMMARY ==================== -->
  <g transform="translate(50, 480)">
    <!-- Pill 1: Frontend -->
    <g transform="translate(0, 0)">
      <rect width="260" height="52" rx="12" fill="url(#cardGrad)" stroke="#6b21a8" stroke-width="1.2"/>
      <circle cx="16" cy="26" r="4" fill="#06b6d4"/>
      <text x="28" y="20" font-family="monospace" font-size="10" fill="#a78bfa" letter-spacing="1">FRONTEND &amp; UI</text>
      <text x="28" y="38" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">React · JavaScript · HTML5/CSS3</text>
    </g>

    <!-- Pill 2: Motion & 3D -->
    <g transform="translate(280, 0)">
      <rect width="260" height="52" rx="12" fill="url(#cardGrad)" stroke="#6b21a8" stroke-width="1.2"/>
      <circle cx="16" cy="26" r="4" fill="#a855f7"/>
      <text x="28" y="20" font-family="monospace" font-size="10" fill="#a78bfa" letter-spacing="1">CREATIVE &amp; 3D</text>
      <text x="28" y="38" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Three.js · GSAP · SVG Animations</text>
    </g>

    <!-- Pill 3: Core & Mobile -->
    <g transform="translate(560, 0)">
      <rect width="260" height="52" rx="12" fill="url(#cardGrad)" stroke="#6b21a8" stroke-width="1.2"/>
      <circle cx="16" cy="26" r="4" fill="#f97316"/>
      <text x="28" y="20" font-family="monospace" font-size="10" fill="#a78bfa" letter-spacing="1">CORE &amp; MOBILE</text>
      <text x="28" y="38" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Java · Flutter · Git · GitHub</text>
    </g>

    <!-- Pill 4: AI & Future -->
    <g transform="translate(840, 0)">
      <rect width="260" height="52" rx="12" fill="url(#cardGrad)" stroke="#6b21a8" stroke-width="1.2"/>
      <circle cx="16" cy="26" r="4" fill="#ec4899"/>
      <text x="28" y="20" font-family="monospace" font-size="10" fill="#a78bfa" letter-spacing="1">AI &amp; INTELLIGENCE</text>
      <text x="28" y="38" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">AI Engineering · Agent Workflows</text>
    </g>
  </g>
</svg>
