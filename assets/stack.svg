<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="stkTitle stkDesc">
  <title id="stkTitle">Living Tech Stack — Planetary Chakra Orbit</title>
  <desc id="stkDesc">Seamless animated chakra planetary orbit showcasing React, JavaScript, Three.js, GSAP, Java, Flutter, AI, Git, and Web technologies without card containers.</desc>
  <defs>
    <!-- Seamless Nebula Atmosphere -->
    <radialGradient id="stackSpace" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1d093d" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0d031c" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030008" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e9d5ff"/>
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0d5c"/>
      <stop offset="70%" stop-color="#14052e"/>
      <stop offset="100%" stop-color="#080214"/>
    </radialGradient>

    <!-- Glowing Rings -->
    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="orbGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes orbitCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes unrotateCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes unrotateCCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rinneganPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px #9333ea); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 45px #06b6d4); }
      }
      @keyframes lightningRay {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.65; stroke: #67e8f9; }
      }
      .ring-inner {
        animation: orbitCW 36s linear infinite;
        transform-origin: 600px 290px;
      }
      .ring-outer {
        animation: orbitCCW 50s linear infinite;
        transform-origin: 600px 290px;
      }
      .upright-1 {
        animation: unrotateCW 36s linear infinite;
      }
      .upright-2 {
        animation: unrotateCCW 50s linear infinite;
      }
      .sun-center {
        animation: rinneganPulse 4.5s ease-in-out infinite;
        transform-origin: 600px 290px;
      }
      .ray-flow {
        animation: lightningRay 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Seamless Canvas -->
  <rect width="1200" height="580" fill="url(#stackSpace)"/>

  <!-- Top Title Strip (Floating cinematic) -->
  <g transform="translate(600, 48)" text-anchor="middle">
    <text font-family="monospace" font-size="12" fill="#c084fc" letter-spacing="4" font-weight="700">
      03 // LIVING CHAKRA ORBIT · CONTINUOUS TECHNOLOGY ARSENAL
    </text>
    <text y="28" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="2">
      PLANETARY DEVELOPER REPERTOIRE
    </text>
  </g>

  <!-- Ambient Light Rays radiating from center to infinity -->
  <g stroke="#7c3aed" stroke-width="1.2" opacity="0.3" class="ray-flow">
    <line x1="600" y1="290" x2="600" y2="90"/>
    <line x1="600" y1="290" x2="600" y2="490"/>
    <line x1="600" y1="290" x2="380" y2="290"/>
    <line x1="600" y1="290" x2="820" y2="290"/>
    <line x1="600" y1="290" x2="300" y2="120"/>
    <line x1="600" y1="290" x2="900" y2="460"/>
    <line x1="600" y1="290" x2="300" y2="460"/>
    <line x1="600" y1="290" x2="900" y2="120"/>
  </g>

  <!-- Orbit Track Circles -->
  <circle cx="600" cy="290" r="160" fill="none" stroke="#581c87" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="600" cy="290" r="255" fill="none" stroke="#3b0764" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6"/>

  <!-- ==================== CENTRAL RINNEGAN CORE SUN ==================== -->
  <g class="sun-center">
    <circle cx="600" cy="290" r="80" fill="url(#sunCore)"/>
    <circle cx="600" cy="290" r="54" fill="#130626" stroke="#c084fc" stroke-width="2.5" filter="url(#coreGlow)"/>
    <!-- Rinnegan rings inside core -->
    <circle cx="600" cy="290" r="38" fill="none" stroke="#a855f7" stroke-width="2"/>
    <circle cx="600" cy="290" r="24" fill="none" stroke="#e9d5ff" stroke-width="2"/>
    <circle cx="600" cy="290" r="10" fill="#ffffff"/>
    <text x="600" y="284" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">CHAKRA</text>
    <text x="600" y="300" font-family="monospace" font-weight="800" font-size="10" fill="#67e8f9" text-anchor="middle">NUCLEUS</text>
  </g>

  <!-- ==================== INNER ORBIT RING (Radius 160px) ==================== -->
  <g class="ring-inner">
    <circle cx="600" cy="290" r="160" fill="none" stroke="url(#orbGrad1)" stroke-width="2.5" stroke-dasharray="30 70" opacity="0.85"/>

    <!-- Node: React (Angle 0) -->
    <g transform="translate(760, 290)">
      <g class="upright-1">
        <circle cx="0" cy="0" r="32" fill="url(#nodeBody)" stroke="#06b6d4" stroke-width="2.2" filter="url(#starGlow)"/>
        <ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#67e8f9" stroke-width="1.4"/>
        <ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#67e8f9" stroke-width="1.4" transform="rotate(60)"/>
        <ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#67e8f9" stroke-width="1.4" transform="rotate(120)"/>
        <circle cx="0" cy="0" r="2.8" fill="#67e8f9"/>
        <text x="0" y="46" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#67e8f9" text-anchor="middle">React</text>
      </g>
    </g>

    <!-- Node: JavaScript (Angle 90) -->
    <g transform="translate(600, 450)">
      <g class="upright-1">
        <circle cx="0" cy="0" r="32" fill="url(#nodeBody)" stroke="#facc15" stroke-width="2.2" filter="url(#starGlow)"/>
        <rect x="-11" y="-11" width="22" height="22" rx="3" fill="#facc15"/>
        <text x="3" y="6" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13" fill="#000000" text-anchor="middle">JS</text>
        <text x="0" y="46" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#facc15" text-anchor="middle">JavaScript</text>
      </g>
    </g>

    <!-- Node: Java (Angle 180) -->
    <g transform="translate(440, 290)">
      <g class="upright-1">
        <circle cx="0" cy="0" r="32" fill="url(#nodeBody)" stroke="#f97316" stroke-width="2.2" filter="url(#starGlow)"/>
        <path d="M -7 4 C -7 10 7 10 7 4 L 7 -6 L -7 -6 Z" fill="none" stroke="#fb923c" stroke-width="1.5"/>
        <path d="M 7 -3 C 10 -3 10 2 7 2" fill="none" stroke="#fb923c" stroke-width="1.3"/>
        <path d="M -3 -9 C -1 -8 -3 -7 -1 -6" fill="none" stroke="#fdba74" stroke-width="1.2"/>
        <text x="0" y="46" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#fb923c" text-anchor="middle">Java</text>
      </g>
    </g>

    <!-- Node: Flutter (Angle 270) -->
    <g transform="translate(600, 130)">
      <g class="upright-1">
        <circle cx="0" cy="0" r="32" fill="url(#nodeBody)" stroke="#38bdf8" stroke-width="2.2" filter="url(#starGlow)"/>
        <path d="M -6 -8 L 4 2 L 9 -3 L -1 -13 Z" fill="#38bdf8"/>
        <path d="M -2 4 L 4 10 L 9 5 L 3 -1 Z" fill="#0284c7"/>
        <text x="0" y="46" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#38bdf8" text-anchor="middle">Flutter</text>
      </g>
    </g>
  </g>

  <!-- ==================== OUTER ORBIT RING (Radius 255px) ==================== -->
  <g class="ring-outer">
    <circle cx="600" cy="290" r="255" fill="none" stroke="url(#orbGrad2)" stroke-width="2" stroke-dasharray="35 85" opacity="0.8"/>

    <!-- Three.js (0 deg) -->
    <g transform="translate(855, 290)">
      <g class="upright-2">
        <circle cx="0" cy="0" r="29" fill="url(#nodeBody)" stroke="#c084fc" stroke-width="2" filter="url(#starGlow)"/>
        <polygon points="0,-11 10,8 -10,8" fill="none" stroke="#e9d5ff" stroke-width="1.6"/>
        <line x1="0" y1="-11" x2="0" y2="0" stroke="#d8b4fe" stroke-width="1.2"/>
        <line x1="10" y1="8" x2="0" y2="0" stroke="#d8b4fe" stroke-width="1.2"/>
        <line x1="-10" y1="8" x2="0" y2="0" stroke="#d8b4fe" stroke-width="1.2"/>
        <text x="0" y="43" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#d8b4fe" text-anchor="middle">Three.js</text>
      </g>
    </g>

    <!-- GSAP (60 deg) -->
    <g transform="translate(727, 510)">
      <g class="upright-2">
        <circle cx="0" cy="0" r="29" fill="url(#nodeBody)" stroke="#22c55e" stroke-width="2" filter="url(#starGlow)"/>
        <circle cx="0" cy="0" r="9" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="45 10"/>
        <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" fill="#4ade80" text-anchor="middle">G</text>
        <text x="0" y="43" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#4ade80" text-anchor="middle">GSAP</text>
      </g>
    </g>

    <!-- AI Development (120 deg) -->
    <g transform="translate(472, 510)">
      <g class="upright-2">
        <circle cx="0" cy="0" r="29" fill="url(#nodeBody)" stroke="#ec4899" stroke-width="2" filter="url(#starGlow)"/>
        <circle cx="-5" cy="-5" r="3" fill="#f472b6"/>
        <circle cx="6" cy="-4" r="3" fill="#f472b6"/>
        <circle cx="0" cy="5" r="3.5" fill="#f43f5e"/>
        <line x1="-5" y1="-5" x2="6" y2="-4" stroke="#f472b6" stroke-width="1.3"/>
        <line x1="-5" y1="-5" x2="0" y2="5" stroke="#f472b6" stroke-width="1.3"/>
        <line x1="6" y1="-4" x2="0" y2="5" stroke="#f472b6" stroke-width="1.3"/>
        <text x="0" y="43" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#f472b6" text-anchor="middle">AI / ML</text>
      </g>
    </g>

    <!-- Git & GitHub (180 deg) -->
    <g transform="translate(345, 290)">
      <g class="upright-2">
        <circle cx="0" cy="0" r="29" fill="url(#nodeBody)" stroke="#f43f5e" stroke-width="2" filter="url(#starGlow)"/>
        <circle cx="-5" cy="-4" r="2.6" fill="#f43f5e"/>
        <circle cx="-5" cy="5" r="2.6" fill="#f43f5e"/>
        <circle cx="5" cy="-2" r="2.6" fill="#f43f5e"/>
        <line x1="-5" y1="-4" x2="-5" y2="5" stroke="#f43f5e" stroke-width="1.6"/>
        <path d="M -5 0 Q 0 0 5 -2" fill="none" stroke="#f43f5e" stroke-width="1.6"/>
        <text x="0" y="43" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#f87171" text-anchor="middle">Git / GitHub</text>
      </g>
    </g>

    <!-- HTML5 (240 deg) -->
    <g transform="translate(472, 70)">
      <g class="upright-2">
        <circle cx="0" cy="0" r="29" fill="url(#nodeBody)" stroke="#e11d48" stroke-width="2" filter="url(#starGlow)"/>
        <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13" fill="#fb7185" text-anchor="middle">&lt;5&gt;</text>
        <text x="0" y="43" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#fb7185" text-anchor="middle">HTML5</text>
      </g>
    </g>

    <!-- CSS3 (300 deg) -->
    <g transform="translate(727, 70)">
      <g class="upright-2">
        <circle cx="0" cy="0" r="29" fill="url(#nodeBody)" stroke="#3b82f6" stroke-width="2" filter="url(#starGlow)"/>
        <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13" fill="#60a5fa" text-anchor="middle">{ 3 }</text>
        <text x="0" y="43" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#60a5fa" text-anchor="middle">CSS3</text>
      </g>
    </g>
  </g>
</svg>
