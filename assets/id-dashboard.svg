<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="telTitle telDesc">
  <title id="telTitle">Shinobi Telemetry Stream — Live Intelligence</title>
  <desc id="telDesc">Seamless holographic Shinobi intelligence ribbon featuring the Konohagakure headband plate, live frequency scanlines, and developer telemetry without boxed card widgets.</desc>
  <defs>
    <!-- Background Atmosphere -->
    <radialGradient id="telSpace" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#190a36" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0a0317" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030008" stop-opacity="1"/>
    </radialGradient>

    <!-- Metal Headband Plate Gradient -->
    <linearGradient id="headbandPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="streamBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes scanStream {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes liveBeacon {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #22c55e); }
      }
      .scanner-beam {
        animation: scanStream 4s linear infinite;
      }
      .beacon-dot {
        animation: liveBeacon 2s infinite;
      }
    </style>
  </defs>

  <!-- Canvas (Seamless, no card container) -->
  <rect width="1200" height="280" fill="url(#telSpace)"/>

  <!-- Top Title Strip -->
  <g transform="translate(600, 42)" text-anchor="middle">
    <text font-family="monospace" font-size="12" fill="#c084fc" letter-spacing="4" font-weight="700">
      01 // HOLOGRAPHIC SHINOBI TELEMETRY · LIVE INTELLIGENCE
    </text>
  </g>

  <!-- Horizontal Laser Telemetry Line -->
  <line x1="50" y1="140" x2="1150" y2="140" stroke="#3b0764" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="350" y2="140" stroke="url(#streamBeam)" stroke-width="2.5" class="scanner-beam" filter="url(#softGlow)"/>

  <!-- Center Floating Konohagakure Headband Plate (Hitai-ate) -->
  <g transform="translate(600, 140)">
    <g transform="translate(-150, -25)">
      <rect width="300" height="50" rx="9" fill="url(#headbandPlate)" stroke="#1e293b" stroke-width="2"/>
      <!-- Rivets -->
      <circle cx="12" cy="15" r="2.5" fill="#1e293b"/>
      <circle cx="12" cy="35" r="2.5" fill="#1e293b"/>
      <circle cx="288" cy="15" r="2.5" fill="#1e293b"/>
      <circle cx="288" cy="35" r="2.5" fill="#1e293b"/>
      <!-- Engraved Leaf Village Swirl Emblem -->
      <path d="M 150 18 C 142 20 138 27 142 33 C 146 38 154 36 156 31 C 157 27 152 25 149 28 C 147 30 150 32 152 31 M 156 34 L 164 38" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <!-- Label underneath plate -->
    <text y="48" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="3">
      KONOHAGAKURE · SAKTHI RENGANATHAN
    </text>
    <text y="68" font-family="monospace" font-size="11" fill="#67e8f9" text-anchor="middle" letter-spacing="2">
      CLASSIFICATION: S-RANK ARCHITECT // ID: SR-DEV-8F4E2B
    </text>
  </g>

  <!-- Left Telemetry Stream (Floating) -->
  <g transform="translate(180, 120)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
    <text font-family="monospace" font-size="11" fill="#a78bfa" letter-spacing="2">CHAKRA NATURE</text>
    <text y="24" font-size="18" font-weight="900" fill="#67e8f9">LIGHTNING &amp; VOID</text>
    <text y="44" font-size="12" fill="#94a3b8">AI &amp; Full-Stack Specialization</text>
  </g>

  <!-- Right Telemetry Stream (Floating) -->
  <g transform="translate(1020, 120)" text-anchor="middle" font-family="'Segoe UI', sans-serif">
    <circle cx="-100" cy="-6" r="4" fill="#22c55e" class="beacon-dot"/>
    <text font-family="monospace" font-size="11" fill="#86efac" letter-spacing="2">ACTIONS PIPELINE</text>
    <text y="24" font-size="18" font-weight="900" fill="#ffffff">DAILY AUTO-SYNC</text>
    <text y="44" font-size="12" fill="#94a3b8">3D Leaf City &amp; Telemetry Active</text>
  </g>

  <!-- Bottom Frequency Wave -->
  <g transform="translate(600, 250)" text-anchor="middle">
    <text font-family="monospace" font-size="11" fill="#475569" letter-spacing="3">
      RINNEGAN LIVE BROADCAST // ALLIANCE SECURE TRANSMISSION
    </text>
  </g>
</svg>
