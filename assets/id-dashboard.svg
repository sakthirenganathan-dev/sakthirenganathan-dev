<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="idTitle idDesc">
  <title id="idTitle">Shinobi Holographic Intelligence Card &amp; Dashboard</title>
  <desc id="idDesc">Futuristic holographic shinobi identity credential showing developer rank, chakra affinity, mission parameters, and live repository telemetry.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="dashBg" cx="40%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#190c36" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0c041c" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030108" stop-opacity="1"/>
    </radialGradient>

    <!-- Metal Headband Plate Gradient -->
    <linearGradient id="headbandPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Hologram Glow -->
    <linearGradient id="holoBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1136" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d061c" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="holoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes scanlineMove {
        0% { transform: translateY(0); opacity: 0.15; }
        50% { opacity: 0.45; }
        100% { transform: translateY(220px); opacity: 0.15; }
      }
      @keyframes blinkLight {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #22c55e); }
      }
      @keyframes holoFlicker {
        0%, 100% { opacity: 0.9; }
        92% { opacity: 0.7; }
        94% { opacity: 1; }
        96% { opacity: 0.8; }
      }
      .scanner {
        animation: scanlineMove 3.5s ease-in-out infinite alternate;
      }
      .beacon {
        animation: blinkLight 2s infinite;
      }
      .holo-pulse {
        animation: holoFlicker 5s infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="380" rx="24" fill="url(#dashBg)"/>
  <rect width="1196" height="376" x="2" y="2" rx="23" fill="none" stroke="#6b21a8" stroke-width="1.5" opacity="0.6"/>

  <!-- Top Strip -->
  <g transform="translate(50, 44)">
    <text font-family="monospace" font-size="13" fill="#a78bfa" letter-spacing="3" font-weight="700">04 / HOLOGRAPHIC SHINOBI INTELLIGENCE</text>
    <text y="24" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#ffffff">
      MISSION LOG &amp; DEVELOPER CREDENTIALS
    </text>
  </g>
  <g transform="translate(1150, 44)" text-anchor="end">
    <circle cx="-160" cy="10" r="4.5" fill="#22c55e" class="beacon"/>
    <text x="0" y="14" font-family="monospace" font-size="12" fill="#86efac" font-weight="700">LIVE SATELLITE LINK ACTIVE</text>
  </g>

  <!-- ==================== LEFT: HOLOGRAPHIC SHINOBI ID CARD ==================== -->
  <g transform="translate(50, 95)" class="holo-pulse">
    <!-- ID Card Base -->
    <rect width="360" height="245" rx="18" fill="url(#cardBg)" stroke="url(#holoBorder)" stroke-width="2"/>
    
    <!-- Scanning Laser Line -->
    <line x1="15" y1="20" x2="345" y2="20" stroke="#06b6d4" stroke-width="2" class="scanner" opacity="0.6" filter="url(#holoGlow)"/>

    <!-- Konoha Forehead Protector (Hitai-ate Metal Plate) -->
    <g transform="translate(25, 22)">
      <rect width="310" height="46" rx="8" fill="url(#headbandPlate)" stroke="#1e293b" stroke-width="1.5"/>
      <!-- Rivets on metal plate -->
      <circle cx="12" cy="14" r="2.5" fill="#1e293b"/>
      <circle cx="12" cy="32" r="2.5" fill="#1e293b"/>
      <circle cx="298" cy="14" r="2.5" fill="#1e293b"/>
      <circle cx="298" cy="32" r="2.5" fill="#1e293b"/>
      <!-- Engraved Leaf Village Swirl Emblem (Konohagakure) -->
      <path d="M 155 16 C 147 18 143 25 147 31 C 151 36 159 34 161 29 C 162 25 157 23 154 26 C 152 28 155 30 157 29 M 161 32 L 169 36" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Credential Data -->
    <g transform="translate(25, 92)" font-family="'Segoe UI', sans-serif">
      <text font-size="11" font-family="monospace" fill="#a78bfa" letter-spacing="1">AGENT CODENAME</text>
      <text y="24" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">SAKTHI RENGANATHAN</text>
      <text y="42" font-size="12" font-family="monospace" fill="#67e8f9" font-weight="700">@sakthirenganathan-dev</text>
      
      <!-- Identity Chips -->
      <g transform="translate(0, 62)">
        <rect width="145" height="42" rx="8" fill="#120726" stroke="#581c87" stroke-width="1"/>
        <text x="12" y="17" font-family="monospace" font-size="9" fill="#a855f7">VILLAGE REGISTRATION</text>
        <text x="12" y="32" font-size="11" font-weight="700" fill="#e2e8f0">HIDDEN LEAF · DEV</text>
      </g>
      <g transform="translate(160, 62)">
        <rect width="150" height="42" rx="8" fill="#120726" stroke="#0891b2" stroke-width="1"/>
        <text x="12" y="17" font-family="monospace" font-size="9" fill="#22d3ee">MISSION CLASSIFICATION</text>
        <text x="12" y="32" font-size="11" font-weight="700" fill="#67e8f9">S-RANK ARCHITECT</text>
      </g>

      <!-- Signature Seal / Barcode -->
      <g transform="translate(0, 120)" font-family="monospace" font-size="10" fill="#64748b">
        <text y="10">AUTH: RINNEGAN-VERIFIED // HASH: 8f4e2b-SHINOBI</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT: 3 TELEMETRY PANELS ==================== -->
  <g transform="translate(435, 95)">
    <!-- Top Row: 3 Metrics Cards -->
    <g transform="translate(0, 0)">
      <!-- Panel 1: Intelligence Scope -->
      <g transform="translate(0, 0)">
        <rect width="225" height="110" rx="14" fill="url(#cardBg)" stroke="#6b21a8" stroke-width="1.2"/>
        <circle cx="20" cy="24" r="5" fill="#a855f7"/>
        <text x="32" y="27" font-family="monospace" font-size="10" fill="#c084fc" letter-spacing="1">CORE ARSENAL</text>
        <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#ffffff">FULL-STACK</text>
        <text x="20" y="82" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Web · Mobile · Cloud</text>
        <rect x="20" y="94" width="185" height="4" rx="2" fill="#3b0764"/>
        <rect x="20" y="94" width="160" height="4" rx="2" fill="#a855f7"/>
      </g>

      <!-- Panel 2: AI & Machine Intelligence -->
      <g transform="translate(245, 0)">
        <rect width="225" height="110" rx="14" fill="url(#cardBg)" stroke="#0891b2" stroke-width="1.2"/>
        <circle cx="20" cy="24" r="5" fill="#06b6d4"/>
        <text x="32" y="27" font-family="monospace" font-size="10" fill="#67e8f9" letter-spacing="1">SPECIALTY JUTSU</text>
        <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#ffffff">AI &amp; AGENTS</text>
        <text x="20" y="82" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">LLMs · Computer Vision</text>
        <rect x="20" y="94" width="185" height="4" rx="2" fill="#083344"/>
        <rect x="20" y="94" width="170" height="4" rx="2" fill="#06b6d4"/>
      </g>

      <!-- Panel 3: Automation & Ops -->
      <g transform="translate(490, 0)">
        <rect width="225" height="110" rx="14" fill="url(#cardBg)" stroke="#22c55e" stroke-width="1.2"/>
        <circle cx="20" cy="24" r="5" fill="#22c55e"/>
        <text x="32" y="27" font-family="monospace" font-size="10" fill="#86efac" letter-spacing="1">DAILY PROTOCOL</text>
        <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#ffffff">ACTIVE CRON</text>
        <text x="20" y="82" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Actions 3D City Sync</text>
        <rect x="20" y="94" width="185" height="4" rx="2" fill="#052e16"/>
        <rect x="20" y="94" width="185" height="4" rx="2" fill="#22c55e"/>
      </g>
    </g>

    <!-- Bottom Wide Row: Active Mission Briefing -->
    <g transform="translate(0, 125)">
      <rect width="715" height="120" rx="14" fill="url(#cardBg)" stroke="#581c87" stroke-width="1.2"/>
      <!-- Header -->
      <g transform="translate(24, 28)">
        <text font-family="monospace" font-size="11" fill="#c084fc" letter-spacing="2">ACTIVE OBJECTIVE // THE SIX PATHS MISSION</text>
        <text y="24" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff">
          Engineering high-impact AI tools, healthcare accessibility, and interactive web applications.
        </text>
        <text y="48" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
          Open to collaborative open-source ventures, enterprise software development, and cutting-edge tech stacks.
        </text>
        <text y="72" font-family="monospace" font-size="11" fill="#67e8f9">
          STATUS: READY FOR SUMMONS · GLOBAL TIMEFRAME ACTIVE
        </text>
      </g>
    </g>
  </g>
</svg>
